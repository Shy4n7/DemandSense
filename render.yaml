services:
  - type: web
    name: demandsense-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: ALLOWED_ORIGIN
        value: "https://demand-sense.vercel.app"
